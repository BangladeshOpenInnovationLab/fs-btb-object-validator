<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project GeoJSON Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .layer-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .count-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 14px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
      font-size: 13px;
      line-height: 1.5;
      color: #222;
      min-width: 210px;
    }

    .count-box h4 {
      margin: 0 0 6px 0;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 4px;
    }

    .count-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .count-row.active {
      font-weight: 600;
    }

    .count-total {
      margin-top: 6px;
      padding-top: 4px;
      border-top: 1px solid #e5e7eb;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
  <script>
    const DEFAULT_ZOOM = 21;
    const map = L.map('map');

    const DEFAULT_TILE_URL =
      'https://tiles.imagery.hotosm.org/raster/collections/openaerialmap/items/f310808a-78fc-4cd5-9e13-9efa64f15194/tiles/WebMercatorQuad/{z}/{x}/{y}?assets=visual&bidx=1&bidx=2&bidx=3&rescale=65.0%2C171.0&rescale=69.0%2C169.0&rescale=62.0%2C164.0&nodata=65535.0';

    const TILEJSON_URL =
      'https://tiles.imagery.hotosm.org/raster/collections/openaerialmap/items/f310808a-78fc-4cd5-9e13-9efa64f15194/WebMercatorQuad/tilejson.json?assets=visual&bidx=1&bidx=2&bidx=3&rescale=65.0%2C171.0&rescale=69.0%2C169.0&rescale=62.0%2C164.0&nodata=65535.0';

    const projects = [
      {
        label: 'Water Tank',
        url: './data/project1.geojson',
        color: '#0077b6'
      },
      {
        label: 'Discarded Tires',
        url: './data/project2.geojson',
        color: '#e63946'
      },
      {
        label: 'Repurposed Tubs or Basins',
        url: './data/project3.geojson',
        color: '#2a9d8f'
      }
    ];

    function createGeoJsonLayer(data, color) {
      return L.geoJSON(data, {
        style: {
          color: color,
          weight: 2.5,
          fillOpacity: 0.3
        },
        pointToLayer: (feature, latlng) => {
          return L.circleMarker(latlng, {
            radius: 7,
            fillColor: color,
            color: '#ffffff',
            weight: 1.5,
            fillOpacity: 0.9
          });
        },
        onEachFeature: (feature, layer) => {
          if (feature.properties) {
            const rows = Object.entries(feature.properties)
              .filter(([k]) => k !== 'imagery_url')
              .map(([k, v]) => `<strong>${k}:</strong> ${v}`)
              .join('<br>');
            if (rows) {
              layer.bindPopup(rows);
            }
          }
        }
      });
    }

    async function loadProject(project) {
      try {
        const res = await fetch(project.url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        if (!text.trim()) {
          return {
            ...project,
            count: 0,
            imageryUrl: null,
            layer: createGeoJsonLayer(null, project.color)
          };
        }
        const data = JSON.parse(text);
        const count = Array.isArray(data.features) ? data.features.length : 0;
        return {
          ...project,
          count,
          imageryUrl: data.imagery_url || null,
          layer: createGeoJsonLayer(data, project.color)
        };
      } catch (err) {
        console.warn(`Could not load ${project.url}:`, err.message);
        return {
          ...project,
          count: 0,
          imageryUrl: null,
          layer: createGeoJsonLayer(null, project.color)
        };
      }
    }

    async function loadImageryMetadata() {
      try {
        const res = await fetch(TILEJSON_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const tj = await res.json();
        const bounds =
          Array.isArray(tj.bounds) && tj.bounds.length === 4
            ? L.latLngBounds([tj.bounds[1], tj.bounds[0]], [tj.bounds[3], tj.bounds[2]])
            : null;
        return {
          bounds,
          minZoom: tj.minzoom ?? 0,
          maxNativeZoom: tj.maxzoom ?? 22
        };
      } catch (err) {
        console.warn('Could not load TileJSON metadata:', err.message);
        return { bounds: null, minZoom: 0, maxNativeZoom: 22 };
      }
    }

    function createCountControl(loadedProjects) {
      const control = L.control({ position: 'bottomleft' });
      let container;

      control.onAdd = function () {
        container = L.DomUtil.create('div', 'count-box');
        L.DomEvent.disableClickPropagation(container);
        control.update(loadedProjects[0].label);
        return container;
      };

      control.update = function (activeLabel) {
        if (!container) return;
        const total = loadedProjects.reduce((sum, p) => sum + p.count, 0);
        const rowsHtml = loadedProjects
          .map((p) => {
            const isActive = p.label === activeLabel;
            return `
              <div class="count-row ${isActive ? 'active' : ''}">
                <span><span class="layer-dot" style="background:${p.color}"></span>${p.label}</span>
                <span>${p.count}</span>
              </div>
            `;
          })
          .join('');

        container.innerHTML = `
          <h4>Detected Objects</h4>
          ${rowsHtml}
          <div class="count-total">
            <span>Total Objects</span>
            <span>${total}</span>
          </div>
        `;
      };

      return control;
    }

    async function initMap() {
      const [imageryMeta, loadedProjects] = await Promise.all([
        loadImageryMetadata(),
        Promise.all(projects.map(loadProject))
      ]);

      // Use imagery_url from GeoJSON if available, otherwise fall back to default URL
      const activeTileUrl =
        loadedProjects.find((p) => p.imageryUrl)?.imageryUrl || DEFAULT_TILE_URL;

      const tileOptions = {
        tms: false,
        minZoom: imageryMeta.minZoom,
        maxNativeZoom: imageryMeta.maxNativeZoom,
        maxZoom: 23,
        attribution: 'Imagery &copy; OpenAerialMap / HOT'
      };
      if (imageryMeta.bounds) {
        tileOptions.bounds = imageryMeta.bounds;
      }
      L.tileLayer(activeTileUrl, tileOptions).addTo(map);

      // Build layer switcher with color dots and object counts
      const switcherLayers = {};
      const htmlLabelToPlain = {};
      let firstValidBounds = null;

      loadedProjects.forEach((item, index) => {
        const displayLabel = `<span class="layer-dot" style="background:${item.color}"></span>${item.label} (<strong>${item.count}</strong>)`;
        switcherLayers[displayLabel] = item.layer;
        htmlLabelToPlain[displayLabel] = item.label;

        const b = item.layer.getBounds();
        if (b.isValid() && !firstValidBounds) {
          firstValidBounds = b;
        }
        if (index === 0) {
          item.layer.addTo(map);
        }
      });

      // Center at zoom 21 on GeoJSON features first, falling back to imagery bounds
      if (firstValidBounds) {
        map.setView(firstValidBounds.getCenter(), DEFAULT_ZOOM);
      } else if (imageryMeta.bounds) {
        map.setView(imageryMeta.bounds.getCenter(), DEFAULT_ZOOM);
      } else {
        map.setView([23.7277, 90.3691], DEFAULT_ZOOM);
      }

      L.control.layers(switcherLayers, null, { collapsed: false }).addTo(map);

      const countControl = createCountControl(loadedProjects).addTo(map);

      map.on('baselayerchange', (e) => {
        const plainLabel = htmlLabelToPlain[e.name];
        if (plainLabel) {
          countControl.update(plainLabel);
        }
        if (e.layer.getBounds && e.layer.getBounds().isValid()) {
          map.panTo(e.layer.getBounds().getCenter());
        }
      });
    }

    initMap();
  </script>
</body>
</html>
